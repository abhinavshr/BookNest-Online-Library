<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="../../css/register.css">
</head>
<body>
    <div class="register-container">
        <h2>Register</h2>
        <form id="registerForm" action="javascript:void(0);">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button type="submit">Register</button>
            </div>
        </form>
        <div id="responseMessage"></div>

        <p style="text-align: center; color: #333;">
            Already have an account?
            <a href="../login.html" style="color: #4CAF50; text-decoration: none; font-weight: bold;">Login here</a>
        </p>

    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const userData = {
                name: name,
                email: email,
                password: password
            };

            fetch('/api/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData)
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Failed to register user');
                    }
                })
                .then(data => {
                    document.getElementById("responseMessage").innerHTML =
                        `<p style="color: green;">User registered successfully! Redirecting to login...</p>`;
                    setTimeout(() => {
                        window.location.href = '../login.html';
                    }, 800);
                })
                .catch(error => {
                    document.getElementById("responseMessage").innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                });
        });
    </script>
</body>
</html>
