    <div class="main-section">

</html>

<script>
    function toggleDropdown() {
        var menu = document.getElementById("profileMenu");
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    document.addEventListener("click", function (event) {
        var isClickInside = event.target.closest(".profile-dropdown");
        if (!isClickInside) {
            document.getElementById("profileMenu").style.display = "none";
        }
    });

    async function removeCartItem(cartItemId) {
        try {
            const response = await fetch(`http://localhost:5223/api/cartitem/${cartItemId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert("Item removed successfully");
                loadCartItems(); 
            } else {
                alert("Failed to remove item");
            }
        } catch (error) {
            console.error("Error removing item:", error);
        }
    }

        async function loadCartItems() {
        try {
            const response = await fetch('http://localhost:5223/api/cartitem'); 
        if (!response.ok) {
                throw new Error('Failed to fetch cart items');
            }

        const items = await response.json();
        const container = document.getElementById('cartItemsContainer');
        container.innerHTML = ""; 

        let total = 0;

            items.forEach(item => {
                const itemHTML = `
        <div class="cart-item">
            <div class="item-image">
                <img src="https://template.canva.com/EADaopxBna4/1/0/251w-ujD6UPGa9hw.jpg" alt="Book Cover">
            </div>
            <div class="item-details">
                <h3>${item.bookTitle}</h3>
                <p class="author">By ${item.author}</p>
                <p class="price">Rs.${item.price}</p>
                <div class="quantity-controls">
                    <span>Quantity: ${item.quantity}</span>
                </div>
            </div>
            <div class="item-actions">
                <button class="remove-btn" onclick="removeCartItem('${item.cartItemId}')">
                    <i class="fas fa-trash"></i> Remove
                </button>
            </div>
        </div>
        `;
        container.innerHTML += itemHTML;
        total += item.price * item.quantity;
            });

        document.querySelector(".summary-row:nth-child(2) span:last-child").innerText = `Rs.${total}`;
        document.querySelector(".summary-row:nth-child(3) span:last-child").innerText = "Rs.50"; 
        document.querySelector(".summary-row:nth-child(4) span:last-child").innerText = `Rs.${(total * 0.1).toFixed(0)}`; 
        const grandTotal = total + 50 + total * 0.1;
        document.querySelector(".summary-row.total span:last-child").innerText = `Rs.${grandTotal.toFixed(0)}`;

        } catch (error) {
            console.error('Error loading cart items:', error);
        }
    }

        loadCartItems();

</script>
