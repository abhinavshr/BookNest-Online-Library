    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="navigation-box">
        <div style="flex-direction: row; display: flex;">
            <div class="nav-inside">
                <a href="index.html">Home</a>
            </div>
            <div class="nav-inside">
                <a href="best_seller.html">Best Seller</a>
            </div>
            <div class="nav-inside">
                <a href="award_winners.html">Award Winners</a>
            </div>
            <div class="nav-inside">
                <a href="new_releases.html">New Releases</a>
            </div>
            <div class="nav-inside">
                <a href="new_arrivals.html">New Arrivals</a>
            </div>
            <div class="nav-inside">
                <a href="comming_soon.html">Comming Soon</a>
            </div>
            <div class="nav-inside">
                <a href="announcement.html">Announcement</a>
            </div>
        </div>
        <div style="flex-direction: row; display: flex;">
            <div class="nav-inside">
                <a href="cart.html"><span class="material-icons cart-icon">shopping_cart</span></a>
            </div>
            <div class="nav-inside">
                <div class="profile-dropdown">
                    <span class="material-icons profile-icon" onclick="toggleDropdown()">person</span>
                    <div class="dropdown-content" style="padding-left: 5px; padding-right: 5px;" id="profileMenu">
                        <a href="order.html" style="color: #2a2a2a; border-bottom: 1px solid #2a2a2a; ">Orders History</a>
                        <a href="bookmark.html" style="color: #2a2a2a; border-bottom: 1px solid #2a2a2a; ">BookMark</a>
                        <a href="#" style="color: #2a2a2a; border-bottom: 1px solid #2a2a2a;">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="main-section">
        <div class="orders-container">
            <h1>Your Orders</h1>
            <div class="orders-list" id="ordersList"></div>
        </div>
    </div>

    <script>
        async function fetchOrdersByUserId() {
            const userId = localStorage.getItem('userID');
            if (!userId) {
                alert("User not logged in!");
                return;
            }
            const ordersList = document.getElementById('ordersList');
            try {
                const response = await fetch(`http://localhost:5223/api/orders/user/${userId}`);
                if (response.ok) {
                    const orders = await response.json();
                    console.log(orders);  // Log orders to inspect the structure
                    if (orders.length > 0) {
                        orders.forEach(order => {
                            const orderCard = document.createElement('div');
                            orderCard.classList.add('order-card');

                            const orderHeader = document.createElement('div');
                            orderHeader.classList.add('order-header');

                            const orderInfo = document.createElement('div');
                            orderInfo.classList.add('order-info');
                            orderInfo.innerHTML = `
                        <span class="order-date">Order Placed: ${new Date(order.orderDate).toLocaleDateString()}</span>
                        <span class="order-total">Total: Rs.${order.totalAmount}</span>
                        <span class="order-id">Order #${order.orderId}</span>
                    `;

                            const orderStatus = document.createElement('div');
                            orderStatus.classList.add('order-status');
                            orderStatus.classList.add(order.orderStatus.toLowerCase());
                            orderStatus.innerHTML = `${order.orderStatus} on ${new Date(order.orderDate).toLocaleDateString()}`;

                            orderHeader.appendChild(orderInfo);
                            orderHeader.appendChild(orderStatus);

                            const orderItems = document.createElement('div');
                            orderItems.classList.add('order-items');

                            order.orderItems.forEach(item => {
                                console.log(item); 
                                const orderItem = document.createElement('div');
                                orderItem.classList.add('order-item');
                                orderItem.innerHTML = `
                            <div class="item-image">
                                <img src="https://template.canva.com/EADaopxBna4/1/0/251w-ujD6UPGa9hw.jpg" alt="Book Cover">
                            </div>
                            <div class="item-details">
                                <h3>${item.bookTitle}</h3>
                                <p class="author">By ${item.author}</p>
                                <p class="price">Rs.${item.price} × ${item.quantity}</p>
                            </div>
                        `;
                                orderItems.appendChild(orderItem);
                            });

                            orderCard.appendChild(orderHeader);
                            orderCard.appendChild(orderItems);
                            ordersList.appendChild(orderCard);
                        });
                    } else {
                        ordersList.innerHTML = '<p>No orders found for this user.</p>';
                    }
                } else {
                    ordersList.innerHTML = '<p>Error loading orders.</p>';
                }
            } catch (error) {
                ordersList.innerHTML = '<p>Error loading orders.</p>';
                console.error('Error:', error);
            }
        }


        window.onload = function () {
            fetchOrdersByUserId();
        };
    </script>
</body>
</html>
