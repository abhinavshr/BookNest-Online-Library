<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm" action="javascript:void(0);">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <input type="submit" value="Login">
        </form>

        <div id="responseMessage"></div>

        <p style="text-align: center; color: #333;">
            Don't have an account?
            <a href="User/register.html" style="color: #4CAF50; text-decoration: none; font-weight: bold;">Sign up here</a>
        </p>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const loginData = {
                email: email,
                password: password
            };

            fetch('http://localhost:5223/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(loginData)
            })
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    if (data.message === "Login successful.") {
                        const token = data.token;
                        const role = data.role;
                        const uid = data.userID;
                        localStorage.setItem("jwtToken", token);
                        localStorage.setItem("userRole", role);
                        localStorage.setItem("userID", uid);
                        console.log("Token stored in localStorage:", localStorage.getItem("jwtToken"));
                        console.log(localStorage.getItem("userRole"));
                        if (role === 'User') {
                            window.location.href = '../index.html';
                        } else if (role === 'Admin' || role === 'Staff') {
                            window.location.href = 'Admin/admindashboard.html';
                        }
                    } else {
                        document.getElementById("responseMessage").innerHTML = `<p style="color: red;">${data.error}</p>`;
                    }
                })
                .catch(error => {
                    console.log('Error:', error);
                    document.getElementById("responseMessage").innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                });
        });
    </script>
</body>
</html>
