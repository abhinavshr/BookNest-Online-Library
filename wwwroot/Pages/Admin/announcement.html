<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Announcement Management</title>
    <link rel="stylesheet" href="../../css/announcement.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="order-management.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="full-container">
            <div class="second-bar">
                <div class="search-bar">
                    <input class="search-customize" type="search" placeholder="Search..." />
                </div>
                <div class="add-bar" id="add-announcement-container">
                    <a href="addannouncement.html" class="add-announcement-button">
                        <span class="material-icons" style="vertical-align: middle; font-size: 19px; margin-right: 5px;">add</span>
                        Add New Announcement
                    </a>
                </div>
            </div>
            <div class="third-bar">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Announcement ID</th>
                            <th>Title</th>
                            <th>Message</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("jwtToken");

        if (!token) {
            window.location.href = '../login.html';
        } else {
            const decodedToken = parseJwt(token);
            if (decodedToken.role !== 'Admin' && decodedToken.role !== 'Staff') {
                window.location.href = '../login.html';
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        async function fetchAnnouncementData() {
            try {
                const response = await fetch('http://localhost:5223/api/announcement');
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const announcementList = await response.json();
                const tbody = document.querySelector('.custom-table tbody');
                tbody.innerHTML = '';

                announcementList.forEach((announcement, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                <td>${index + 1}</td>
                <td>${announcement.announcementId}</td>
                <td>${announcement.title}</td>
                <td>${announcement.message}</td>
                <td>${announcement.startDate}</td>
                <td>${announcement.endDate}</td>
                <td><button onclick="deleteAnnouncement('${announcement.announcementId}')">Delete</button></td>
            `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching announcements:', error);
            }
        }



        async function deleteAnnouncement(announcementId) {
            if (confirm(`Are you sure you want to delete announcement with ID ${announcementId}?`)) {
                try {
                    const response = await fetch(`http://localhost:5223/api/announcement/${announcementId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        alert('Announcement deleted successfully.');
                        fetchAnnouncementData();
                    } else if (response.status === 404) {
                        alert('Announcement not found.');
                    } else {
                        const error = await response.json();
                        alert(`Error deleting announcement: ${error.error || 'Unknown error'}`);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to delete announcement.');
                }
            }
        }


        function checkUserRole() {
            const loggedInUserRole = localStorage.getItem('userRole');
            if (loggedInUserRole !== 'Staff') {
                document.getElementById('add-announcement-container').style.display = 'none';
            }
        }

        window.onload = () => {
            fetchAnnouncementData();
            checkUserRole();
        };

        function logout() {
            localStorage.removeItem("jwtToken");
            localStorage.removeItem("userRole");
            alert("You have been logged out.");
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
