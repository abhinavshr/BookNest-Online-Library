<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Generes Management</title>
    <link rel="stylesheet" href="../../css/generes_management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="ordermanagement.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="full-container">
            <div class="second-bar">
                <div class="search-bar">
                    <input class="search-customize" type="search" placeholder="Search..." />
                </div>
                <div class="add-bar" id="add-author-container">
                    <a href="addgeneres.html" class="add-author-button">
                        <span class="material-icons" style="vertical-align: middle; font-size: 19px; margin-right: 5px;">person_add</span>
                        Add New Generes
                    </a>
                </div>
            </div>
            <div class="third-bar">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Genre ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("jwtToken");

        if (!token) {
            window.location.href = '../login.html';
        } else {
            const decodedToken = parseJwt(token);
            if (decodedToken.role !== 'Admin' && decodedToken.role !== 'Staff') {
                window.location.href = '../login.html';
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        async function fetchGenreData() {
            try {
                const response = await fetch('http://localhost:5223/api/genres');
                if (!response.ok) throw new Error('Failed to fetch genres');
                const genreList = await response.json();

                const tbody = document.querySelector('.custom-table tbody');
                tbody.innerHTML = '';

                genreList.forEach((genre, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${genre.genreId}</td>
                            <td>${genre.name}</td>
                            <td>${genre.description}</td>
                            <td>
                                <a href="editgeneres.html?id=${genre.genreId}">
                                    <button>Edit</button>
                                </a>
                                <button onclick="deleteGenre('${genre.genreId}')">Delete</button>
                            </td>
                        `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching genres:', error);
            }
        }

        async function deleteGenre(genreId) {
            const isConfirmed = confirm(`Are you sure you want to delete the genre with ID ${genreId}?`);

            if (!isConfirmed) {
                return;
            }

            const response = await fetch(`http://localhost:5223/api/genres/${genreId}`, {
                method: 'DELETE',
            });

            if (response.ok) {
                console.log(`Deleted genre with ID: ${genreId}`);
                fetchGenreData();
            } else {
                const error = await response.json();
                console.error("Error deleting genre:", error);
            }
        }

        function checkUserRole() {
            const loggedInUserRole = localStorage.getItem('userRole');
            if (loggedInUserRole !== 'Staff') {
                document.getElementById('add-author-container').style.display = 'none';
            }
        }

        window.onload = () => {
            fetchGenreData();
            checkUserRole();
        };

        function logout() {
            localStorage.removeItem("jwtToken");
            localStorage.removeItem("userRole");
            alert("You have been logged out.");
            window.location.href = '../login.html';
        }
    </script>

</body>
</html>
