<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Author Management</title>
    <link rel="stylesheet" href="../../css/author_management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="order-management.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="full-container">
            <div class="second-bar">
                <div class="search-bar">
                    <input class="search-customize" type="search" placeholder="Search..." />
                </div>
                <div class="add-bar" id="add-author-container">
                    <a href="addauthor.html" class="add-author-button">
                        <span class="material-icons" style="vertical-align: middle; font-size: 19px; margin-right: 5px;">person_add</span>
                        Add New Author
                    </a>
                </div>
            </div>
            <div class="third-bar">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Author ID</th>
                            <th>Name</th>
                            <th>Biography</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>

        const token = localStorage.getItem("jwtToken");

        if (!token) {
            window.location.href = '../login.html';
        } else {
            const decodedToken = parseJwt(token);
            if (decodedToken.role !== 'Admin' && decodedToken.role !== 'Staff') {
                window.location.href = '../login.html';
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        async function fetchAuthorData() {
            try {
                const response = await fetch('http://localhost:5223/api/author/getallauthors');
                if (!response.ok) throw new Error('Failed to fetch authors');
                const authorList = await response.json();

                const tbody = document.querySelector('.custom-table tbody');
                tbody.innerHTML = '';

                authorList.forEach((author, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${author.authorId}</td>
                        <td>${author.name}</td>
                        <td>${author.biography}</td>
                        <td>
                            <a href="editauthor.html?id=${author.authorId}">
                                <button>Edit</button>
                            </a>
                            <button onclick="deleteAuthor('${author.authorId}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching authors:', error);
            }
        }

        async function deleteAuthor(authorId) {
            if (confirm(`Are you sure you want to delete author with ID ${authorId}?`)) {
                try {
                    const response = await fetch(`http://localhost:5223/api/author/${authorId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        alert('Author deleted successfully.');
                        fetchAuthorData();
                    } else if (response.status === 404) {
                        alert('Author not found.');
                    } else {
                        const error = await response.json();
                        alert(`Error deleting author: ${error.error || 'Unknown error'}`);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to delete author.');
                }
            }
        }

        function checkUserRole() {
            const loggedInUserRole = localStorage.getItem('userRole');
            if (loggedInUserRole !== 'Staff') {
                document.getElementById('add-author-container').style.display = 'none';
            }
        }

        window.onload = () => {
            fetchAuthorData();
            checkUserRole();
        };

        function logout() {
            alert("Logging out...");
        }
    </script>
</body>
</html>
