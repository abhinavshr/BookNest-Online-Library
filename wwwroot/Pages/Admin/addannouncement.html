<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Announcement</title>
    <link rel="stylesheet" href="../../css/addannouncement.css">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="author-management.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="ordermanagement.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="form-container">
            <h2>Add New Announcement</h2>
            <form id="addAnnouncementForm" action="javascript:void(0);">
                <div class="form-group">
                    <label for="announcementTitle">Title</label>
                    <input type="text" id="announcementTitle" name="title" required>
                </div>
                <div class="form-group">
                    <label for="announcementMessage">Message</label>
                    <textarea id="announcementMessage" name="message" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" name="startDate" required>
                </div>
                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate" name="endDate" required>
                </div>
                <div class="form-group">
                    <button type="submit">Add Announcement</button>
                </div>
            </form>
            <div id="responseMessage"></div>
        </div>
    </div>

    <script>
        document.getElementById("addAnnouncementForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const data = {
                title: document.getElementById("announcementTitle").value,
                message: document.getElementById("announcementMessage").value,
                startDate: document.getElementById("startDate").value,
                endDate: document.getElementById("endDate").value
            };

            fetch("http://localhost:5223/api/announcement/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (!response.ok) throw new Error("Failed to add announcement");
                    return response.json();
                })
                .then(result => {
                    document.getElementById("responseMessage").innerText = "Announcement added successfully! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "announcement.html";
                    }, 1000);
                })
                .catch(error => {
                    document.getElementById("responseMessage").innerText = "Error: " + error.message;
                });
        });

        function logout() {
            localStorage.removeItem("jwtToken");
            localStorage.removeItem("userRole");
            alert("You have been logged out.");
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
