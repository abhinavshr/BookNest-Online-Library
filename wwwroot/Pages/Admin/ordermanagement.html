<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Order Management</title>
    <link rel="stylesheet" href="../../css/book_management.css">
    <link rel="stylesheet" href="../../css/order_management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="ordermanagement.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div style="margin-left:200px; padding: 30px 20px;">
        <h2>Orders</h2>
        <table id="orderTable">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>User ID</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orderBody">
            </tbody>
        </table>
    </div>

    <div id="claimModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Enter Claim Code</h3>
            <input type="text" id="claimCodeInput" maxlength="4" placeholder="4-digit code" />
            <button onclick="submitClaimCode()">Submit</button>
        </div>
    </div>

    <script>
        let currentOrderId = null;

        async function loadOrders() {
            try {
                const response = await fetch("http://localhost:5223/api/orders");
                const orders = await response.json();

                const orderBody = document.getElementById("orderBody");
                orderBody.innerHTML = "";

                orders.forEach(order => {
                    const isPending = (order.orderStatus?.toLowerCase() === 'pending');
                    const buttonClass = isPending ? 'status-btn clickable' : 'status-btn disabled';
                    const buttonHtml = isPending
                        ? `<button class="${buttonClass}" onclick="openClaimModal('${order.orderId}')">${order.orderStatus}</button>`
                        : `<button class="${buttonClass}" disabled>${order.orderStatus || 'N/A'}</button>`;

                    const row = `
                                <tr>
                                    <td>${order.orderId}</td>
                                    <td>${order.userId}</td>
                                    <td>Rs.${order.totalAmount.toFixed(2)}</td>
                                    <td>${buttonHtml}</td>
                                </tr>
                            `;
                    orderBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error loading orders:", error);
            }
        }

        function openClaimModal(orderId) {
            currentOrderId = orderId;
            document.getElementById("claimModal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("claimModal").style.display = "none";
            document.getElementById("claimCodeInput").value = "";
        }

        async function submitClaimCode() {
            const code = document.getElementById("claimCodeInput").value;
            if (/^\d{4}$/.test(code)) {
                const response = await fetch("http://localhost:5223/api/orders/check-claim-code", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        orderId: currentOrderId,
                        claimCode: code
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    closeModal();
                    loadOrders();
                } else {
                    alert(result.message);
                }
            } else {
                alert("Please enter a valid 4-digit code.");
            }
        }

        window.onload = loadOrders;

        window.onclick = function (event) {
            const modal = document.getElementById("claimModal");
            if (event.target == modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
