<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Book Management</title>
    <link rel="stylesheet" href="../../css/book_management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="order-management.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="full-container">
            <div class="second-bar">
                <div class="search-bar">
                    <input class="search-customize" type="search" placeholder="Search..." />
                </div>
                <div class="add-bar" id="add-book-container">
                    <a href="addbook.html" class="add-book-button">
                        <span class="material-icons" style="vertical-align: middle; font-size: 19px; margin-right: 5px;">library_add</span>
                        Add New Book
                    </a>
                </div>
            </div>
            <div class="third-bar">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Book ID</th>
                            <th>Title</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("jwtToken");

        if (!token) {
            window.location.href = '../login.html';
        } else {
            const decodedToken = parseJwt(token);
            if (decodedToken.role !== 'Admin' && decodedToken.role !== 'Staff') {
                window.location.href = '../login.html';
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        async function fetchBookData() {
            try {
                const response = await fetch('http://localhost:5223/api/book');
                if (!response.ok) throw new Error(`Error ${response.status}`);

                const bookList = await response.json();
                const tbody = document.querySelector('.custom-table tbody');
                tbody.innerHTML = '';

                bookList.forEach((book, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${book.bookId}</td>
                    <td>${book.title}</td>
                    <td>${book.price.toFixed(2)}</td>
                    <td><button onclick="deleteBook('${book.bookId}')">Delete</button></td>
                `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching books:', error);
            }
        }

        async function deleteBook(bookId) {
            if (confirm(`Are you sure you want to delete book with ID ${bookId}?`)) {
                try {
                    const response = await fetch(`http://localhost:5223/api/book/${bookId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        alert('Book deleted successfully.');
                        fetchBookData();
                    } else {
                        const errorData = await response.json();
                        alert('Failed to delete book: ' + (errorData.error || response.statusText));
                    }
                } catch (error) {
                    console.error('Error deleting book:', error);
                    alert('An error occurred while deleting the book.');
                }
            }
        }


        function checkUserRole() {
            const loggedInUserRole = localStorage.getItem('userRole');
            if (loggedInUserRole !== 'Staff') {
                document.getElementById('add-book-container').style.display = 'none';
            }
        }

        function logout() {
            alert("Logging out...");
            localStorage.removeItem("jwtToken");
            window.location.href = '../login.html';
        }

        window.onload = () => {
            fetchBookData();
            checkUserRole();
        };
    </script>
</body>
</html>
