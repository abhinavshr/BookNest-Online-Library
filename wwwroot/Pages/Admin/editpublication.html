<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Publication</title>
    <link rel="stylesheet" href="../../css/add_publication.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="author-management.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="order-management.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="form-container">
            <h2>Edit Existing Publication</h2>
            <form id="editPublicationForm" action="javascript:void(0);">
                <div class="form-group">
                    <label for="publicationName">Name</label>
                    <input type="text" id="publicationName" name="publicationName" required>
                </div>
                <div class="form-group">
                    <label for="publicationDescription">Description</label>
                    <textarea id="publicationDescription" name="publicationDescription" rows="4" required></textarea>
                </div>
                <button type="submit">Update Publication</button>
            </form>
            <div id="responseMessage"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("jwtToken");

        if (!token) {
            window.location.href = '../login.html';
        } else {
            const decodedToken = parseJwt(token);
            if (decodedToken.role !== 'Admin' && decodedToken.role !== 'Staff') {
                window.location.href = '../login.html';
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const publisherId = urlParams.get('id');

        async function loadPublisherData() {
            try {
                const response = await fetch(`http://localhost:5223/api/publisher/${publisherId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load publisher data');

                const data = await response.json();
                document.getElementById("publicationName").value = data.name;
                document.getElementById("publicationDescription").value = data.description;
            } catch (error) {
                document.getElementById("responseMessage").innerHTML =
                    `<p class="error">Error loading data: ${error.message}</p>`;
            }
        }

        document.getElementById("editPublicationForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const updatedData = {
                name: document.getElementById("publicationName").value,
                description: document.getElementById("publicationDescription").value
            };

            try {
                const response = await fetch(`http://localhost:5223/api/publisher/${publisherId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(updatedData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to update publisher');
                }

                document.getElementById("responseMessage").innerHTML =
                    `<p class="success">Publication updated successfully! Redirecting...</p>`;
                setTimeout(() => {
                    window.location.href = 'publication_management.html';
                }, 1000);

            } catch (error) {
                document.getElementById("responseMessage").innerHTML =
                    `<p class="error">Error: ${error.message}</p>`;
            }
        });

        window.onload = loadPublisherData;
    </script>
</body>
</html>
