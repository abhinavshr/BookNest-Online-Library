<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Discount</title>
    <link rel="stylesheet" href="../../css/adddiscounts.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="order-management.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="form-container">
            <h2>Add New Discount</h2>
            <form id="addDiscountForm">
                <label for="bookId">Book ID:</label>
                <input type="text" id="bookId" name="bookId" required>

                <label for="discountType">Discount Type:</label>
                <select id="discountType" name="discountType" required>
                    <option value="">Select type</option>
                    <option value="Percentage">Percentage</option>
                    <option value="Flat">Flat</option>
                </select>

                <label for="value">Value:</label>
                <input type="number" id="value" name="value" required>

                <label for="isOnSale">Is On Sale:</label>
                <select id="isOnSale" name="isOnSale" required>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>

                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" name="startDate" required>

                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" name="endDate" required>

                <button type="submit">Add Discount</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('addDiscountForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const discountData = {
                bookId: document.getElementById('bookId').value,
                discountType: document.getElementById('discountType').value,
                value: parseFloat(document.getElementById('value').value),
                isOnSale: document.getElementById('isOnSale').value === 'true',
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value
            };

            try {
                const response = await fetch('http://localhost:5223/api/discounts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(discountData)
                });

                if (!response.ok) {
                    throw new Error('Failed to add discount');
                }

                alert('Discount added successfully!');
                window.location.href = 'discounts.html';
            } catch (error) {
                console.error('Error adding discount:', error);
                alert('Error adding discount. Please try again.');
            }
        });

        function logout() {
            alert("Logging out...");
            // Add actual logout logic
        }
    </script>
</body>
</html>
