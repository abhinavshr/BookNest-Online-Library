<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Discount Management</title>
    <link rel="stylesheet" href="../../css/discounts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="ordermanagement.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="full-container">
            <div class="second-bar">
                <div class="search-bar">
                    <input class="search-customize" type="search" placeholder="Search..." />
                </div>
                <div class="add-bar" id="add-discount-container">
                    <a href="adddiscounts.html" class="add-discount-button">
                        <span class="material-icons" style="vertical-align: middle; font-size: 19px; margin-right: 5px;">add</span>
                        Add New Discount
                    </a>
                </div>
            </div>
            <div class="third-bar">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Discount ID</th>
                            <th>Book ID</th>
                            <th>Type</th>
                            <th>Value</th>
                            <th>On Sale</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchDiscounts() {
            try {
                const response = await fetch('http://localhost:5223/api/discounts/all');
                if (!response.ok) throw new Error('Failed to fetch discounts');
                const data = await response.json();

                const tbody = document.querySelector('.custom-table tbody');
                tbody.innerHTML = '';
                data.forEach((discount, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                <td>${index + 1}</td>
                <td>${discount.discountId}</td>
                <td>${discount.bookId}</td>
                <td>${discount.discountType}</td>
                <td>${discount.value}</td>
                <td>${discount.isOnSale ? 'Yes' : 'No'}</td>
                <td>${new Date(discount.startDate).toLocaleDateString()}</td>
                <td>${new Date(discount.endDate).toLocaleDateString()}</td>
                <td><button onclick="deleteDiscount('${discount.discountId}')">Delete</button></td>
            `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching discounts:', error);
            }
        }


        async function deleteDiscount(discountId) {
            console.log('Deleting discount with ID:', discountId);

            const token = localStorage.getItem("jwtToken");

            if (!token) {
                alert('You are not logged in.');
                window.location.href = '../login.html';
                return;
            }

            if (confirm(`Are you sure you want to delete discount with ID ${discountId}?`)) {
                try {
                    const response = await fetch(`http://localhost:5223/api/discounts/${discountId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        alert('Discount deleted successfully.');
                        fetchDiscounts(); 
                    } else if (response.status === 404) {
                        alert('Discount not found.');
                    } else {
                        const error = await response.json();
                        alert(`Error deleting discount: ${error.error || 'Unknown error'}`);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to delete discount.');
                }
            }
        }

        function checkUserRole() {
            const userRole = localStorage.getItem('userRole');
            if (userRole !== 'Staff') {
                document.getElementById('add-discount-container').style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem("jwtToken");
            localStorage.removeItem("userRole");
            alert("You have been logged out.");
            window.location.href = '../login.html';
        }

        window.onload = () => {
            fetchDiscounts();
            checkUserRole();
        };
    </script>
</body>
</html>
