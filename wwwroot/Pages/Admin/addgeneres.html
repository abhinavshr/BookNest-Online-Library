<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Add Generes</title>
    <link rel="stylesheet" href="../../css/add_generes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="author-management.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="order-management.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="form-container">
            <h2>Add New Generes</h2>
            <form id="addGeneresForm" action="javascript:void(0);">
                <div class="form-group">
                    <label for="generesName">Name</label>
                    <input type="text" id="generesName" name="generesName" required>
                </div>
                <div class="form-group">
                    <label for="authorBiography">Description</label>
                    <textarea id="authorBiography" name="authorBiography" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <button type="submit">Add Generes</button>
                </div>
            </form>
            <div id="responseMessage"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("jwtToken");

        if (!token) {
            window.location.href = '../login.html';
        } else {
            const decodedToken = parseJwt(token);
            if (decodedToken.role !== 'Admin' && decodedToken.role !== 'Staff') {
                window.location.href = '../login.html';
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        document.getElementById("addGeneresForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const generesName = document.getElementById("generesName").value;
            const generesDescription = document.getElementById("authorBiography").value;

            const genreData = { name: generesName, description: generesDescription };

            fetch('http://localhost:5223/api/genres/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(genreData)
            })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Failed to add genre');
                })
                .then(data => {
                    document.getElementById("responseMessage").innerHTML =
                        `<p class="success">Genre added successfully! Redirecting...</p>`;
                    setTimeout(() => {
                        window.location.href = 'generes_management.html';
                    }, 1000);
                })
                .catch(error => {
                    document.getElementById("responseMessage").innerHTML =
                        `<p class="error">Error: ${error.message}</p>`;
                });
        });

        function logout() {
            alert("Logging out...");
        }
    </script>
</body>
</html>
