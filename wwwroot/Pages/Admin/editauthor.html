<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Author</title>
    <link rel="stylesheet" href="../../css/add_author.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="sidebar">
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="staff_page.html">Staff Management</a></li>
            <li><a href="authorpage.html">Author Management</a></li>
            <li><a href="generes_management.html">Genres Management</a></li>
            <li><a href="publication_management.html">Publication Management</a></li>
            <li><a href="book_management.html">Book Management</a></li>
            <li><a href="order-management.html">Order Management</a></li>
            <li><a href="announcement.html">Announcement</a></li>
            <li><a href="discounts.html">Discounts</a></li>
            <li><a href="javascript:void(0);" onclick="logout()">Logout</a></li>
        </ul>
    </div>

    <div id="content">
        <div class="form-container">
            <h2>Edit Existing Author</h2>
            <form id="editAuthorForm" action="javascript:void(0);">
                <div class="form-group">
                    <label for="authorName">Name</label>
                    <input type="text" id="authorName" name="authorName" required>
                </div>
                <div class="form-group">
                    <label for="authorBiography">Biography</label>
                    <textarea id="authorBiography" name="authorBiography" rows="4" required></textarea>
                </div>
                <!-- Add the submit button here -->
                <div class="form-group">
                    <button type="submit" class="submit-button">Update Author</button>
                </div>
            </form>
            <div id="responseMessage"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("jwtToken");

        if (!token) {
            window.location.href = '../login.html';
        } else {
            const decodedToken = parseJwt(token);
            if (decodedToken.role !== 'Admin' && decodedToken.role !== 'Staff') {
                window.location.href = '../login.html';
            }
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const authorId = urlParams.get('id');

        async function fetchAuthorData() {
            try {
                const response = await fetch(`http://localhost:5223/api/author/${authorId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('authorName').value = data.name;
                    document.getElementById('authorBiography').value = data.biography;
                } else {
                    throw new Error('Failed to fetch author data');
                }
            } catch (error) {
                document.getElementById("responseMessage").innerHTML =
                    `<p class="error">Error: ${error.message}</p>`;
            }
        }

        window.onload = fetchAuthorData;

        document.getElementById("editAuthorForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const authorName = document.getElementById("authorName").value;
            const authorBiography = document.getElementById("authorBiography").value;

            const authorData = { name: authorName, biography: authorBiography };

            fetch(`http://localhost:5223/api/author/${authorId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(authorData)
            })
                .then(response => {
                    if (response.ok) {
                        document.getElementById("responseMessage").innerHTML =
                            `<p class="success">Author updated successfully! Redirecting...</p>`;
                        setTimeout(() => {
                            window.location.href = 'authorpage.html';
                        }, 1000);
                    } else {
                        throw new Error('Failed to update author');
                    }
                })
                .catch(error => {
                    document.getElementById("responseMessage").innerHTML =
                        `<p class="error">Error: ${error.message}</p>`;
                });
        });

        function logout() {
            localStorage.removeItem("jwtToken");
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
